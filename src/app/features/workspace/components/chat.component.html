<div class="chat-wrapper">
  <div class="chat-header">
    <h1 class="chat-title">Asynco Messenger</h1>
    <div class="connection-badge" [class.connected]="isConnected()">
      <span class="status-dot"></span>
      {{ isConnected() ? 'Connected' : 'Disconnected' }}
    </div>
  </div>

  <div class="messages-container" #messagesContainer>
    @if (messages().length === 0) {
      <div class="empty-state">
        <p>No messages yet. Start a conversation!</p>
      </div>
    }
    
    @for (message of messages(); track message.id) {
      <div class="message {{message.status}}" [class.own-message]="message.sender === 'Me'">
        <div class="message-bubble">
          <p class="message-text">{{ message.text }}</p>
          <div class="message-meta">
            <span class="message-time">{{ formatTime(message.timestamp) }}</span>
            <span [class]="'status-icon ' + getStatusClass(message.status)">
              {{ getStatusIcon(message.status) }}
            </span>
          </div>
        </div>
      </div>
    }
  </div>

  <form class="input-section" (ngSubmit)="sendMessage()">
    <input
      type="text"
      class="message-input"
      placeholder="Type a message..."
      [(ngModel)]="messageText"
      name="messageText"
      [disabled]="!isConnected()"
    />
    <button
      type="submit"
      class="send-button"
      [disabled]="!isConnected() || !messageText().trim()"
      aria-label="Send message"
    >
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <path d="M16.6915026,12.4744748 L3.50612381,13.2599618 C3.19218622,13.2599618 3.03521743,13.4170592 3.03521743,13.5741566 L1.15159189,20.0151496 C0.8376543,20.8006365 0.99,21.89 1.77946707,22.52 C2.41,22.99 3.50612381,23.1 4.13399899,22.8429026 L21.714504,14.0454487 C22.6563168,13.5741566 23.1272231,12.6315722 22.9702544,11.6889879 L4.13399899,1.16865566 C3.34915502,0.9115582 2.40734225,1.02728539 1.77946707,1.4985775 C0.994623095,2.13788947 0.837654326,3.22732741 1.15159189,3.99531084 L3.03521743,10.4362939 C3.03521743,10.5933913 3.19218622,10.7504886 3.50612381,10.7504886 L16.6915026,11.5359755 C16.6915026,11.5359755 17.1624089,11.5359755 17.1624089,12.0072676 C17.1624089,12.4744748 16.6915026,12.4744748 16.6915026,12.4744748 Z" />
      </svg>
    </button>
  </form>
</div>
